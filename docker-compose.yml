version: '3.8'

services:
  backend:
    build: ./backend
    container_name: geotrack-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./geotrack.db
      - SECRET_KEY=geotrack-hrms-secret-key-change-in-production
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
    volumes:
      - ./backend/geotrack.db:/app/geotrack.db

  frontend:
    build: ./frontend
    container_name: geotrack-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
